<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Inter', 'Calibri', sans-serif; }
    </style>
  </defs>

  <!-- Logo -->
  <image href="/Users/christianwutz/Desktop/RedySet/Clients/Centripetal Advisors/Centripetal_Pentagon/linkedin_assets/LinkedIn Assets/Centripetal_LinkedIn_Profile.png" x="30" y="20" width="70" height="70"/>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#4B6147"/>

  <!-- Header -->
  <text x="540" y="100" text-anchor="middle" fill="#DDD8CD" font-size="24" font-weight="600" letter-spacing="3">METRIC OF THE WEEK</text>
  <text x="540" y="170" text-anchor="middle" fill="#FFFFFF" font-size="56" font-weight="800">The SaaS</text>
  <text x="540" y="240" text-anchor="middle" fill="#FFFFFF" font-size="56" font-weight="800">Magic Number</text>

  <!-- Formula Box -->
  <rect x="90" y="290" width="900" height="100" rx="12" fill="#5A7A54"/>
  <text x="540" y="350" text-anchor="middle" fill="#DDD8CD" font-size="28" font-weight="600">Net New ARR (this Q) ÷ S&amp;M Spend (last Q)</text>

  <!-- Benchmark Scale -->
  <text x="540" y="450" text-anchor="middle" fill="#DDD8CD" font-size="22" font-weight="600" letter-spacing="2">2026 BENCHMARKS</text>

  <!-- Red zone: Below 0.5 -->
  <rect x="90" y="490" width="900" height="110" rx="10" fill="#8B4513" opacity="0.6"/>
  <text x="140" y="530" fill="#FFFFFF" font-size="40" font-weight="800">&lt; 0.5</text>
  <text x="140" y="575" fill="#DDD8CD" font-size="22" font-weight="400">Inefficient — fix GTM before scaling spend</text>
  <circle cx="980" cy="545" r="30" fill="none" stroke="#FF6B6B" stroke-width="4"/>
  <line x1="960" y1="525" x2="1000" y2="565" stroke="#FF6B6B" stroke-width="4"/>
  <line x1="1000" y1="525" x2="960" y2="565" stroke="#FF6B6B" stroke-width="4"/>

  <!-- Yellow zone: 0.5-0.75 -->
  <rect x="90" y="615" width="900" height="110" rx="10" fill="#8A7A40" opacity="0.5"/>
  <text x="140" y="655" fill="#FFFFFF" font-size="40" font-weight="800">0.5 – 0.75</text>
  <text x="140" y="700" fill="#DDD8CD" font-size="22" font-weight="400">Room for improvement — optimize, don't accelerate</text>
  <text x="965" y="680" fill="#FFD700" font-size="40" font-weight="700">⚠</text>

  <!-- Green zone: 0.75-1.0 -->
  <rect x="90" y="740" width="900" height="110" rx="10" fill="#4B6147" opacity="0.5"/>
  <text x="140" y="780" fill="#FFFFFF" font-size="40" font-weight="800">0.75 – 1.0</text>
  <text x="140" y="825" fill="#DDD8CD" font-size="22" font-weight="400">Efficient — scale sales &amp; marketing with confidence</text>
  <circle cx="980" cy="795" r="25" fill="none" stroke="#8AE68A" stroke-width="4"/>
  <polyline points="960,795 975,810 1000,780" fill="none" stroke="#8AE68A" stroke-width="4"/>

  <!-- Excellent zone: Above 1.0 -->
  <rect x="90" y="865" width="900" height="110" rx="10" fill="#243221" opacity="0.5"/>
  <text x="140" y="905" fill="#FFFFFF" font-size="40" font-weight="800">Directional</text>
  <text x="140" y="950" fill="#DDD8CD" font-size="22" font-weight="400">Use the signal to investigate channel and cohort efficiency</text>
  <text x="965" y="930" fill="#8AE68A" font-size="40" font-weight="700">🚀</text>

  <!-- AI callout -->
  <rect x="90" y="1020" width="900" height="90" rx="10" fill="#DDD8CD" opacity="0.15"/>
  <text x="540" y="1060" text-anchor="middle" fill="#DDD8CD" font-size="20" font-weight="600">📊 Use the Magic Number as a directional efficiency signal</text>
  <text x="540" y="1090" text-anchor="middle" fill="#DDD8CD" font-size="18" font-weight="400">Then inspect the channel, cohort, and cash assumptions underneath it</text>

  <!-- Pro tip -->
  <rect x="90" y="1140" width="900" height="80" rx="10" fill="#5A7A54"/>
  <text x="540" y="1175" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600">💡 Pro Tip: Break your Magic Number down by channel</text>
  <text x="540" y="1200" text-anchor="middle" fill="#DDD8CD" font-size="18">Inbound vs. Outbound vs. Paid — the delta tells you where to invest</text>

  <!-- Footer -->
  <line x1="90" y1="1260" x2="990" y2="1260" stroke="#DDD8CD" stroke-width="1"/>
  <text x="540" y="1300" text-anchor="middle" fill="#DDD8CD" font-size="20" font-weight="600">CENTRIPETAL ADVISORS</text>
  <text x="540" y="1330" text-anchor="middle" fill="#DDD8CD" font-size="16">Follow for weekly SaaS metric breakdowns</text>
</svg>
