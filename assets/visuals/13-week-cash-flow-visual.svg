<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Inter', 'Calibri', sans-serif; }
    </style>
  </defs>

  <!-- Logo -->
  <image href="/Users/christianwutz/Desktop/RedySet/Clients/Centripetal Advisors/Centripetal_Pentagon/linkedin_assets/LinkedIn Assets/Centripetal_LinkedIn_Profile.png" x="30" y="20" width="70" height="70"/>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#4B6147"/>

  <!-- Header -->
  <text x="540" y="90" text-anchor="middle" fill="#DDD8CD" font-size="22" font-weight="600" letter-spacing="3">FRAMEWORK</text>
  <text x="540" y="155" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800">13-Week Cash Flow</text>
  <text x="540" y="210" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="800">Model Structure</text>

  <!-- Row 1: Opening Balance -->
  <rect x="90" y="260" width="900" height="90" rx="10" fill="#FFFFFF"/>
  <rect x="90" y="260" width="8" height="90" rx="4" fill="#243221"/>
  <text x="130" y="295" fill="#243221" font-size="24" font-weight="700">Row 1</text>
  <text x="250" y="295" fill="#243221" font-size="24" font-weight="600">Opening Cash Balance</text>
  <text x="250" y="330" fill="#5A7A54" font-size="18">Week 1 = bank balance. Each week pulls from prior closing balance.</text>

  <!-- Row 2: Inflows -->
  <rect x="90" y="365" width="900" height="110" rx="10" fill="#FFFFFF"/>
  <rect x="90" y="365" width="8" height="110" rx="4" fill="#4B6147"/>
  <text x="130" y="405" fill="#243221" font-size="24" font-weight="700">Row 2</text>
  <text x="250" y="405" fill="#243221" font-size="24" font-weight="600">Cash Inflows</text>
  <text x="250" y="435" fill="#5A7A54" font-size="18">• Subscription collections (not bookings)</text>
  <text x="250" y="460" fill="#5A7A54" font-size="18">• One-time payments • Other income</text>

  <!-- Arrow down -->
  <text x="540" y="500" text-anchor="middle" fill="#DDD8CD" font-size="30">▼</text>

  <!-- Row 3: Outflows -->
  <rect x="90" y="510" width="900" height="110" rx="10" fill="#FFFFFF"/>
  <rect x="90" y="510" width="8" height="110" rx="4" fill="#8B4513"/>
  <text x="130" y="550" fill="#243221" font-size="24" font-weight="700">Row 3</text>
  <text x="250" y="550" fill="#243221" font-size="24" font-weight="600">Cash Outflows</text>
  <text x="250" y="580" fill="#5A7A54" font-size="18">• Payroll (~70% of SaaS expenses) • Rent • Software</text>
  <text x="250" y="605" fill="#5A7A54" font-size="18">• Contractors • Insurance • Other recurring</text>

  <!-- Arrow down -->
  <text x="540" y="645" text-anchor="middle" fill="#DDD8CD" font-size="30">▼</text>

  <!-- Row 4: Net Cash -->
  <rect x="90" y="655" width="900" height="90" rx="10" fill="#FFFFFF"/>
  <rect x="90" y="655" width="8" height="90" rx="4" fill="#4B6147"/>
  <text x="130" y="690" fill="#243221" font-size="24" font-weight="700">Row 4</text>
  <text x="250" y="690" fill="#243221" font-size="24" font-weight="600">Net Cash Flow</text>
  <text x="250" y="725" fill="#5A7A54" font-size="18">Inflows minus outflows for each week</text>

  <!-- Arrow down -->
  <text x="540" y="770" text-anchor="middle" fill="#DDD8CD" font-size="30">▼</text>

  <!-- Row 5: Closing Balance -->
  <rect x="90" y="780" width="900" height="90" rx="10" fill="#FFFFFF"/>
  <rect x="90" y="780" width="8" height="90" rx="4" fill="#2E5090"/>
  <text x="130" y="815" fill="#243221" font-size="24" font-weight="700">Row 5</text>
  <text x="250" y="815" fill="#243221" font-size="24" font-weight="600">Closing Cash Balance</text>
  <text x="250" y="850" fill="#5A7A54" font-size="18">Opening + Net = Closing → rolls forward as next week's opening</text>

  <!-- Flag Triggers Section -->
  <text x="540" y="930" text-anchor="middle" fill="#DDD8CD" font-size="22" font-weight="700" letter-spacing="2">FLAG TRIGGERS</text>

  <rect x="90" y="955" width="900" height="70" rx="8" fill="#8B4513" opacity="0.5"/>
  <text x="120" y="997" fill="#FFFFFF" font-size="20" font-weight="600">🔴 Cash &lt; 6 months net burn → Start fundraising prep immediately</text>

  <rect x="90" y="1040" width="900" height="70" rx="8" fill="#8A7A40" opacity="0.4"/>
  <text x="120" y="1082" fill="#FFFFFF" font-size="20" font-weight="600">🟡 Weekly outflow &gt; 150% avg → Investigate and reforecast</text>

  <rect x="90" y="1125" width="900" height="70" rx="8" fill="#8A7A40" opacity="0.4"/>
  <text x="120" y="1167" fill="#FFFFFF" font-size="20" font-weight="600">🟡 Actuals miss forecast &gt;15% 2 weeks running → Full reforecast</text>

  <!-- Footer -->
  <line x1="90" y1="1240" x2="990" y2="1240" stroke="#DDD8CD" stroke-width="1"/>
  <text x="540" y="1280" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">Update every Monday. Compare actuals vs. forecast.</text>
  <text x="540" y="1310" text-anchor="middle" fill="#DDD8CD" font-size="20" font-weight="600">CENTRIPETAL ADVISORS</text>
  <text x="540" y="1338" text-anchor="middle" fill="#DDD8CD" font-size="16">DM for our free 13-week cash flow template</text>
</svg>